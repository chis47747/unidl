# Clean UniDL configuration. No accounts, tokens, cookies, vault
# entries, proxies, or remote endpoints are stored here.
# Run UniDL from this checkout, or pass this file explicitly with --config.

paths:
  home: .
  commands: ./download_commands
  exports: ./exports
  keys_db: ./db/keys.db
  downloads: ./downloads

cdm:
  default: widevine-test
  devices:
    widevine-test: ./cdm/widevine/device.wvd
    playready-test: ./cdm/playready/device.prd
    monalisa-test: ./cdm/monalisa/device.mld

credentials: {}
helpers: {}
proxies: {}
services: {}
